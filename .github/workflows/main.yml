name: Backend Init Validation and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate-backend:
    name: Install and Verify Flask RAG Engine
    runs-on: ubuntu-latest

    # Environment variables fed securely into the runtime execution context
    env:
      OPENROUTER_KEY: "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"
      YOUR_WEBSITE_URL: "https://prasanjit137.netlify.app/"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "requirements.txt"

      - name: Install Python Environment & Dependencies
        run: |
          uv venv .venv --python 3.12
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH
          uv pip install -r requirements.txt

      - name: Install Playwright Chromium & System Dependencies
        run: |
          uv run playwright install --with-deps chromium

      - name: Dry-Run App Initialization
        run: |
          # Boots your Flask application, scrapes your Netlify portfolio, 
          # indexes it into ChromaDB, and verifies the system initializes perfectly.
          uv run python app.py &
          PID=$!
          sleep 12
          kill $PID || echo "Server completed validation step."
